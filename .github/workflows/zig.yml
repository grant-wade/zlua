name: Zig

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full suite (${{ matrix.os }}, Zig ${{ matrix.zig }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.16.0", "0.17.0"]
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ matrix.zig }}
          cache-key: ${{ matrix.zig }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
      - name: Cache Lua dependencies
        uses: actions/cache@v6.1.0
        with:
          path: .zlua-deps
          key: ${{ runner.os }}-lua-${{ hashFiles('tools/fetch-lua.sh') }}
      - name: Full test suite and WASM smoke test
        run: zig build ci test-wasm check-tools --summary all
      - name: Downstream embedding project
        working-directory: examples/project
        run: zig build run test --summary all

  pr-check:
    name: PR checks
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Full test matrix did not pass: $TEST_RESULT"
            exit 1
          fi
