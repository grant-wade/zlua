name: Zig

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Push checks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          cache-key: ${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
      - name: Unit tests and WASM smoke test
        run: zig build test test-wasm --summary all

  test:
    name: Full suite (${{ matrix.os }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
          - windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        if: matrix.os != 'windows-11-arm'
        with:
          cache-key: ${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
      # Zig 0.16.0's native Windows ARM compiler crashes before building.
      # https://codeberg.org/ziglang/zig/issues/31865
      - name: Install x64 Zig for Windows ARM
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $manifest = Get-Content build.zig.zon -Raw
          $zigVersion = [regex]::Match($manifest, '\.minimum_zig_version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $zigVersion) { throw 'Missing minimum_zig_version' }
          $index = Invoke-RestMethod https://ziglang.org/download/index.json
          $archive = $index.$zigVersion.'x86_64-windows'
          $zipPath = Join-Path $env:RUNNER_TEMP zig.zip
          $sdkPath = Join-Path $env:RUNNER_TEMP zig-sdk
          Invoke-WebRequest $archive.tarball -OutFile $zipPath
          if ((Get-FileHash $zipPath -Algorithm SHA256).Hash -ne $archive.shasum) {
            throw 'Zig archive checksum mismatch'
          }
          Expand-Archive $zipPath -DestinationPath $sdkPath
          $zigPath = Join-Path $sdkPath "zig-x86_64-windows-$zigVersion"
          $zigPath | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$zigPath/zig.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache Lua dependencies
        uses: actions/cache@v6.1.0
        with:
          path: .zlua-deps
          key: ${{ runner.os }}-lua-${{ hashFiles('tools/fetch-lua.sh') }}
      - name: Full test suite and WASM smoke test
        env:
          CI_RUNNER_ARCH: ${{ runner.arch }}
          CI_RUNNER_OS: ${{ runner.os }}
        run: |
          args=()
          if [[ "$CI_RUNNER_OS" == "Windows" && "$CI_RUNNER_ARCH" == "ARM64" ]]; then
            args+=(-Dtarget=aarch64-windows)
          fi
          zig build ci test-wasm --summary all "${args[@]}"

  pr-check:
    name: PR checks
    needs: test
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Full test matrix did not pass: $TEST_RESULT"
            exit 1
          fi
